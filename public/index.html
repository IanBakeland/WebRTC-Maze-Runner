<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop - WebRTC Controller</title>
    <style>
        .cursor {
            position: absolute;
            width: 1rem;
            height: 1rem;
            margin-left: -.5rem;
            margin-top: -.5rem;
            background: red;
            border-radius: 50%;
            transition: top .1s, left .1s;
        }
    </style>
</head>

<body>
    <h1>Desktop Controller</h1>
    <p id="socketId">Connecting...</p>
    <p id="status">Waiting for controller...</p>
    <div id="qr"></div>
    <div id="cursor" class="cursor" style="display:none;"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"
        integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const $socketId = document.getElementById('socketId');
        const $status = document.getElementById('status');
        const $cursor = document.getElementById('cursor');

        let socket;
        let peer;

        const init = () => {
            socket = io.connect('/');

            socket.on('connect', () => {
                console.log(`Connected: ${socket.id}`);
                $socketId.textContent = `Socket ID: ${socket.id}`;

                const url = `${new URL(`/controller.html?id=${socket.id}`, window.location)}`;

                const typeNumber = 4;
                const errorCorrectionLevel = 'L';
                const qr = qrcode(typeNumber, errorCorrectionLevel);
                qr.addData(url);
                qr.make();
                document.getElementById('qr').innerHTML = qr.createImgTag(4);
            });

            // Signalling: ontvang signal van controller via socket
            socket.on('signal', (myId, signal, peerId) => {
                console.log(`Received signal from ${peerId}`);
                if (signal.type === 'offer') {
                    // Controller stuurt een offer, wij beantwoorden
                    createPeer(false, peerId);
                }
                peer.signal(signal);
            });
        };

        const createPeer = (initiator, peerId) => {
            peer = new SimplePeer({ initiator });

            peer.on('signal', data => {
                socket.emit('signal', peerId, data);
            });

            // Data channel: ontvang berichten van controller
            peer.on('data', data => {
                const message = JSON.parse(data);
                if (message.type === 'cursor') {
                    $cursor.style.display = 'block';
                    $cursor.style.left = `${message.x * window.innerWidth}px`;
                    $cursor.style.top = `${message.y * window.innerHeight}px`;
                }
            });

            peer.on('connect', () => {
                console.log('WebRTC data channel connected!');
                $status.textContent = 'Controller connected via WebRTC!';
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
            });
        };

        init();
    </script>
</body>

</html>
